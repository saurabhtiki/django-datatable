[project]
name = "django-datatable"
version = "0.1.0"
description = "Server-side table for Django: column filters, sort, pages, CSV. htmx + Alpine.js + DaisyUI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["django>=5.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["django_datatable"]

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-django>=4.14.0", "ruff>=0.17.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]

[tool.ruff]
line-length = 100
